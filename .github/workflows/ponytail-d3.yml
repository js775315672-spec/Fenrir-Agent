name: Ponytail D3 matched model and hybrid comparison
on:
  push:
    branches: [dev/ponytail-d3-compare-20261127]
    paths: ['fenrir/d3_compare.py', 'tests/test_d3_compare.py', '.github/workflows/ponytail-d3.yml']
permissions:
  contents: read
concurrency:
  group: ponytail-d3-${{ github.sha }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        size: ['0.5b','1.5b','3b']
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -p 'test_d3_compare.py' -v
      - name: CPU setup
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://ollama.com/install.sh -o /tmp/install-ollama.sh
          bash /tmp/install-ollama.sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "qwen2.5:${{ matrix.size }}"
      - name: Actual matched direct and hybrid calls
        run: python3 -B -m fenrir.d3_compare "${{ matrix.size }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-bench-${{ matrix.size }}
          path: out/
          if-no-files-found: warn
  selection:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: d3-bench-*
          path: bench
      - name: Regrade raw outputs and select smallest qualifying model
        run: python3 -B -m fenrir.d3_compare select
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/FENRIR_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-selection
          path: out/
          if-no-files-found: warn
